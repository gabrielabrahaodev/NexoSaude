name = "nexosaude-private-documents"
main = "src/index.js"
compatibility_date = "2026-10-17"
workers_dev = true

[vars]
FIREBASE_PROJECT_ID = "nexosaude"
# Configure com a(s) origem(ns) EXATA(S) do Hosting; sem barra no final.
ALLOWED_ORIGINS = "https://nexosaude.web.app,https://nexosaude.firebaseapp.com"

# Namespaces devem ser únicos na conta Cloudflare; troque se já estiverem em uso.
[[ratelimits]]
name = "UPLOAD_RATE_LIMITER"
namespace_id = "9101701"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "DOWNLOAD_LINK_RATE_LIMITER"
namespace_id = "9101702"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "DELETE_RATE_LIMITER"
namespace_id = "9101703"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "CONTENT_RATE_LIMITER"
namespace_id = "9101704"
simple = { limit = 60, period = 60 }

[[r2_buckets]]
binding = "FILES"
bucket_name = "nexosaude-private-documents"

[[ratelimits]]
name = "TRIAL_REQUEST_IP_RATE_LIMITER"
namespace_id = "9101705"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "TRIAL_REQUEST_USER_RATE_LIMITER"
namespace_id = "9101706"
simple = { limit = 3, period = 60 }
