name: ci

on:
  push:
    branches: [master, producao, remodelagem-gpt]
  pull_request:

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze --no-pub
      - run: flutter test

  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm i -g firebase-tools
      - run: npm install --no-save @firebase/rules-unit-testing firebase-admin
        working-directory: test/rules
      - run: firebase emulators:exec --only firestore "npm --prefix test/rules test"
