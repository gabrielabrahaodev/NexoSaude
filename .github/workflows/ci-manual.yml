name: ci-manual

# Sem gatilho automático (decisão operacional 16/10): rode manualmente
# pela aba Actions (Run workflow) ou via CLI:
#   gh workflow run ci-manual --ref master
# A publicação de Rules depende da matriz verde + ordem explícita.
on:
  workflow_dispatch:

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      # Gate = 0 erros (avisos/infos pré-existentes não bloqueiam).
      - run: flutter analyze --no-pub --no-fatal-warnings --no-fatal-infos
      - run: flutter test

  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm i -g firebase-tools
      - run: npm install --no-save @firebase/rules-unit-testing firebase-admin
        working-directory: test/rules
      - run: firebase emulators:exec --only firestore "npm --prefix test/rules test"
