<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexoSaúde — Master da Plataforma</title>
    <style>
        :root { --bg: #0f1113; --card: #1a1e22; --card2: #22272d; --line: #2e343b; --txt: #e9ecef; --mut: #9aa1a9; --teal: #00c897; --teal-ink: #052e24; --red: #ff8a80; --green: #3ddc84; --orange: #ffb35c; }
        * { box-sizing: border-box; }
        body { font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--txt); margin: 0; padding: 0 16px 48px; }
        .wrap { max-width: 860px; margin: 0 auto; }
        header.top { display: flex; align-items: center; gap: 10px; padding: 14px 0; border-bottom: 1px solid var(--line); }
        .mark { width: 30px; height: 30px; border-radius: 9px; background: var(--teal); color: var(--teal-ink); font-weight: 800; display: flex; align-items: center; justify-content: center; }
        .brand { font-weight: 800; }
        .tag { margin-left: auto; font-size: 12px; color: var(--mut); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; }
        .tabs { display: flex; gap: 6px; margin: 14px 0 4px; flex-wrap: wrap; }
        .tabs button { flex: 1; background: var(--card); color: var(--mut); border: 1px solid var(--line); min-width: 100px; }
        .tabs button.sel { background: var(--teal); color: var(--teal-ink); border-color: var(--teal); }
        .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-top: 10px; }
        .big { font-size: 16px; font-weight: 700; }
        .muted { color: var(--mut); font-size: 13px; }
        .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        input, select { width: 100%; padding: 12px; border-radius: 11px; border: 1px solid var(--line); background: var(--card2); color: var(--txt); margin-top: 8px; font-size: 16px; }
        button { border: none; border-radius: 12px; padding: 12px 14px; font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; }
        button:disabled { opacity: .55; }
        .btn-ok { background: var(--teal); color: var(--teal-ink); width: 100%; margin-top: 12px; }
        .btn-ghost { background: transparent; color: #6ea8ff; border: 1px solid var(--line); }
        .btn-danger { background: transparent; color: var(--red); border: 1px solid var(--line); }
        .btn-row { display: flex; gap: 8px; margin-top: 10px; }
        .btn-row button { flex: 1; }
        .pill { font-size: 11px; font-weight: 700; border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
        .p-ok { background: rgba(61,220,132,.13); color: var(--green); }
        .p-bad { background: rgba(255,138,128,.13); color: var(--red); }
        .p-warn { background: rgba(255,179,92,.14); color: var(--orange); }
        .err { color: var(--red); text-align: center; }
        .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        @media (max-width: 560px) { .grid2 { grid-template-columns: 1fr; } }
        .skel { border-radius: 16px; padding: 14px; margin-top: 10px; background: linear-gradient(90deg, var(--card) 25%, var(--card2) 50%, var(--card) 75%); background-size: 200% 100%; animation: sh 1.2s infinite; min-height: 70px; }
        @keyframes sh { to { background-position: -200% 0; } }
        #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); background: var(--card2); border: 1px solid var(--line); border-radius: 12px; padding: 12px 18px; font-size: 14px; opacity: 0; transition: all .25s; pointer-events: none; max-width: 90vw; z-index: 9; }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>
<div class="wrap">
    <header class="top"><div class="mark">N</div><div class="brand">NexoSaúde</div><div class="tag">Master da plataforma</div></header>
    <div id="content" style="margin-top:6px"></div>
</div>
<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
<script>
    const firebaseConfig = {
        apiKey: "AIzaSyD-4NjgWl9qa9wkb1EN-nB9wgWmzK815No",
        authDomain: "nexosaude.firebaseapp.com",
        projectId: "nexosaude",
        storageBucket: "nexosaude.firebasestorage.app",
        messagingSenderId: "388133875376",
        appId: "1:388133875376:web:ad058507ea0b0f86cd5575"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const content = document.getElementById('content');
    const BRL = (v) => 'R$ ' + Number(v || 0).toFixed(2);
    const fmtD = (d) => d.toLocaleDateString('pt-BR', {day:'2-digit',month:'2-digit'});

    let toastT = null;
    function toast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        clearTimeout(toastT);
        toastT = setTimeout(() => t.classList.remove('show'), 3200);
    }
    function esc(s) {
        return String(s ?? '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }
    function ts2d(ts) { return ts && ts.toDate ? ts.toDate() : (ts ? new Date(ts) : null); }

    let tab = 'owners';

    // Dados vindos do Firestore nunca são interpolados em handlers JavaScript.
    // IDs de documentos podem ser escolhidos pelo cliente e devem ser tratados
    // como entrada não confiável mesmo quando normalmente são auto-gerados.
    content.addEventListener('click', (event) => {
        const button = event.target.closest('button[data-action]');
        if (!button || !content.contains(button)) return;
        const id = button.dataset.id || '';
        switch (button.dataset.action) {
            case 'toggle-block':
                toggleBlock(id, button.dataset.blocked === 'true');
                break;
            case 'generate-debit':
                genDebit(id);
                break;
            case 'approve-trial':
                aprovarPedido(id);
                break;
            case 'refuse-trial':
                recusarPedido(id);
                break;
            case 'dismiss-reset':
                dismissReset(id);
                break;
            case 'settle-debit': {
                const amount = Number(button.dataset.amount);
                if (Number.isFinite(amount) && amount >= 0) settle(id, amount);
                else toast('Valor do débito inválido.');
                break;
            }
            case 'dismiss-notice':
                dismissNotice(id);
                break;
            case 'login':
                doLogin();
                break;
            case 'go-tab':
                if (['owners', 'pedidos', 'new', 'debits', 'trials', 'resets'].includes(button.dataset.tab)) {
                    goTab(button.dataset.tab);
                }
                break;
            case 'sign-out':
                auth.signOut();
                break;
            case 'create-owner':
                createOwner();
                break;
        }
    });

    auth.onAuthStateChanged(async (user) => {
        if (!user) return loginView();
        content.innerHTML = '<div class="skel"></div>';
        try {
            const u = await db.collection('users').doc(user.uid).get();
            if (!u.exists || u.data().role !== 'superadmin') {
                content.innerHTML = '<p class="err">Acesso restrito ao dono da plataforma.</p>';
                await auth.signOut();
                return;
            }
            renderTabs();
        } catch (e) {
            content.innerHTML = '<p class="err">Falha ao carregar. Tente de novo.</p>';
        }
    });

    function loginView() {
        content.innerHTML = '<div class="card"><div class="big">Entrar</div>'
            + '<p class="muted">Acesso do dono da plataforma.</p>'
            + '<input id="em" type="email" placeholder="E-mail" autocomplete="username">'
            + '<input id="pw" type="password" placeholder="Senha" autocomplete="current-password">'
            + '<button class="btn-ok" data-action="login">Acessar</button></div>';
    }

    async function doLogin() {
        const em = document.getElementById('em').value.trim();
        const pw = document.getElementById('pw').value;
        if (!em || !pw) { toast('Informe e-mail e senha.'); return; }
        try { await auth.signInWithEmailAndPassword(em, pw); }
        catch (e) { toast('Login inválido.'); }
    }

    function renderTabs() {
        content.innerHTML = '<div class="tabs">'
            + ['owners|Owners', 'pedidos|Pedidos', 'new|Novo owner', 'debits|Débitos', 'trials|Trials', 'resets|Resets'].map((t) => {
                const parts = t.split('|');
                return '<button class="' + (tab === parts[0] ? 'sel' : '') + '" data-action="go-tab" data-tab="' + parts[0] + '">' + parts[1] + '</button>';
            }).join('')
            + '</div><div id="tabbody"></div>'
            + '<button class="btn-ghost" style="width:100%;margin-top:12px" data-action="sign-out">Sair</button>';
        loadTab();
    }

    function goTab(t) { tab = t; renderTabs(); }

    async function loadTab() {
        const body = document.getElementById('tabbody');
        body.innerHTML = '<div class="skel"></div><div class="skel"></div>';
        try {
            if (tab === 'owners') await ownersTab(body);
            else if (tab === 'pedidos') await pedidosTab(body);
            else if (tab === 'new') newOwnerTab(body);
            else if (tab === 'debits') await debitsTab(body);
            else if (tab === 'resets') await resetsTab(body);
            else await trialsTab(body);
        } catch (e) { body.innerHTML = '<p class="err">Falha ao carregar.</p>'; }
    }

    async function staffCount(cid) {
        const us = await db.collection('users').where('allowedClinics', 'array-contains', cid).get();
        let n = 0;
        us.forEach((d) => { if ((d.data().role || '') !== 'owner') n++; });
        return n;
    }

    function trialInfo(m) {
        const t = ts2d(m.trialEndsAt);
        const blocked = m.blockedByAdmin === true;
        const over = t ? t < new Date() : false;
        const txt = !t ? 'sem trial' : over ? 'expirado' : 'trial até ' + fmtD(t);
        const cls = (blocked || over) ? 'p-bad' : 'p-ok';
        return {txt: txt + (blocked ? ' • BLOQUEADA' : ''), cls: cls, blocked: blocked, over: over};
    }

    async function ownersTab(body) {
        const cs = await db.collection('clinics').get();
        if (cs.empty) { body.innerHTML = '<div class="card"><p class="muted">Nenhuma clínica. Crie o primeiro owner na aba Novo owner.</p></div>'; return; }
        let html = '';
        for (const c of cs.docs) {
            const m = c.data();
            const n = await staffCount(c.id);
            const tr = trialInfo(m);
            html += '<div class="card"><div class="row"><div><div class="big">' + esc(m.name || '') + '</div>'
                + '<div class="muted">' + esc(m.type || '') + ' • ' + n + ' usuário(s) • ' + tr.txt + '</div></div>'
                + '<span class="pill ' + tr.cls + '">' + (tr.blocked || tr.over ? 'ATENÇÃO' : 'OK') + '</span></div>'
                + '<div class="btn-row"><button class="btn-ghost" data-action="toggle-block" data-id="' + esc(c.id) + '" data-blocked="' + (!tr.blocked) + '">' + (tr.blocked ? 'Liberar' : 'Bloquear') + '</button>'
                + '<button class="btn-ghost" data-action="generate-debit" data-id="' + esc(c.id) + '">Gerar mensalidade</button></div></div>';
        }
        body.innerHTML = html;
    }

    async function toggleBlock(cid, blocked) {
        try {
            await db.collection('clinics').doc(cid).update({blockedByAdmin: blocked});
            toast(blocked ? 'Clínica bloqueada.' : 'Clínica liberada.');
            loadTab();
        } catch (e) { toast('Falha. Tente de novo.'); }
    }

    // --- PEDIDOS DE TRIAL (porteira): aprovar cria clínica + trial 7d ---
    async function pedidosTab(body) {
        const rs = await db.collection('trial_requests').where('status', '==', 'solicitado').limit(50).get();
        if (rs.empty) { body.innerHTML = '<div class="card"><p class="muted">Nenhum pedido pendente.</p></div>'; return; }
        let html = '';
        rs.forEach((r) => {
            const m = r.data();
            html += '<div class="card"><div class="big">' + esc(m.nome || '') + '</div>'
                + '<div class="muted">' + esc(m.email || '') + ' • ' + esc(m.whatsapp || '') + '<br>'
                + esc(m.clinicName || '') + ' (' + esc(m.type || '') + ')</div>'
                + '<div class="btn-row"><button class="btn-ghost" data-action="whatsapp" data-phone="' + esc(m.whatsapp || '') + '">WhatsApp</button>'
                + '<button class="btn-ghost" data-action="approve-trial" data-id="' + esc(r.id) + '">Aprovar + criar</button>'
                + '<button class="btn-ghost" data-action="refuse-trial" data-id="' + esc(r.id) + '">Recusar</button></div></div>';
        });
        body.innerHTML = html;
        body.querySelectorAll('[data-action="whatsapp"]').forEach((button) => {
            button.addEventListener('click', () => chamarZap(button.dataset.phone || ''));
        });
    }

    function chamarZap(phone) {
        let clean = String(phone || '').replace(/\D/g, '').slice(0, 15);
        if (!clean) { toast('Sem WhatsApp no pedido.'); return; }
        if (clean.length === 10 || clean.length === 11) {
            // O formulário pede DDD+número brasileiro; normaliza para wa.me.
            // Se já vier com DDI 55 (12/13 dígitos), preserva.
            clean = '55' + clean;
        }
        if (clean.length < 12 || clean.length > 15) {
            toast('WhatsApp inválido; confira DDD e número.');
            return;
        }
        window.open('https://wa.me/' + clean + '?text=' + encodeURIComponent('Olá! Aqui é do NexoSaúde sobre seu teste grátis.'), '_blank', 'noopener,noreferrer');
    }

    function writeOwnerMemberMirrors(batch, clinicId, uid, user) {
        const createdAt = user.createdAt || user.created_at || new Date();
        const clinicRef = db.collection('clinics').doc(clinicId);
        const common = {
            uid: uid, name: user.name || '', role: user.role || 'owner',
            status: user.status || 'Ativo', createdAt: createdAt, updatedAt: new Date()
        };
        batch.set(clinicRef.collection('members').doc(uid), common);
        batch.set(clinicRef.collection('members_private').doc(uid), {
            ...common,
            email: user.email || '', phone: user.phone || '', whatsapp: user.whatsapp || '',
            cpf: user.cpf || '',
            menuAccess: user.menuAccess && typeof user.menuAccess === 'object' && !Array.isArray(user.menuAccess)
                ? user.menuAccess : {},
            allowedClinics: [clinicId]
        });
    }

    async function aprovarPedido(rid) {
        try {
            const requestRef = db.collection('trial_requests').doc(rid);
            const requestSnap = await requestRef.get();
            if (!requestSnap.exists) { toast('Pedido não encontrado.'); return; }
            const m = requestSnap.data() || {};
            if (m.status !== 'solicitado' || !m.uid) {
                toast('Este pedido já foi processado ou não tem uid válido.');
                return;
            }
            const ownerRef = db.collection('users').doc(m.uid);
            const ownerSnap = await ownerRef.get();
            if (!ownerSnap.exists) { toast('Perfil do proprietário não encontrado.'); return; }
            const owner = ownerSnap.data() || {};
            if (owner.role !== 'owner' || owner.status !== 'pending_approval' ||
                (Array.isArray(owner.allowedClinics) && owner.allowedClinics.length > 0)) {
                toast('O perfil não está no estado esperado para aprovação.');
                return;
            }

            const clinicRef = db.collection('clinics').doc();
            const clinicName = m.clinicName || 'Clínica';
            const now = new Date();
            const clinic = {
                name: clinicName, type: ['dental', 'psychology'].includes(m.type) ? m.type : 'dental',
                ownerId: m.uid, createdAt: now,
                trialEndsAt: new Date(Date.now() + 7 * 86400000), blockedByAdmin: false,
            };
            const batch = db.batch();
            batch.set(clinicRef, clinic);
            batch.set(db.collection('public_clinics').doc(clinicRef.id), {
                name: clinicName, whatsappNumber: m.whatsapp || '',
                updatedAt: now,
            });
            batch.update(ownerRef, {allowedClinics: [clinicRef.id], status: 'Ativo'});
            writeOwnerMemberMirrors(batch, clinicRef.id, m.uid, {
                ...owner,
                name: owner.name || m.nome || '',
                role: 'owner', status: 'Ativo',
                allowedClinics: [clinicRef.id],
            });
            batch.update(requestRef, {status: 'aprovado', clinicId: clinicRef.id});
            await batch.commit();
            toast('Trial liberado por 7 dias.');
            loadTab();
        } catch (e) {
            console.error('Falha ao aprovar pedido:', e);
            toast('Falha ao aprovar. Confira o estado do pedido antes de repetir.');
        }
    }

    // Fila GLOBAL de resets (pedidos do login, sem clinicId): SÓ Master vê.
    // Fluxo: rode migrate/reset-senha.bat p/ o e-mail, informe a temporária
    // pelo canal verificado e dispense aqui (a temporária NUNCA fica no doc).
    async function resetsTab(body) {
        const rs = await db.collection('password_reset_requests').where('status', '==', 'pending').limit(50).get();
        if (rs.empty) { body.innerHTML = '<div class="card"><p class="muted">Nenhum pedido pendente.</p></div>'; return; }
        let html = '';
        rs.forEach((r) => {
            const m = r.data();
            html += '<div class="card"><div class="big">' + esc(m.email || '') + '</div>'
                + '<div class="muted">' + (m.clinicId ? 'clínica: ' + esc(m.clinicId) : 'login (sem clínica)') + '</div>'
                + '<div class="btn-row"><button class="btn-ghost" data-action="dismiss-reset" data-id="' + esc(r.id) + '">Dispensar</button></div></div>';
        });
        body.innerHTML = html;
    }

    async function dismissReset(rid) {
        try {
            await db.collection('password_reset_requests').doc(rid).delete();
            toast('Pedido dispensado.');
            loadTab();
        } catch (e) { toast('Falha. Tente de novo.'); }
    }

    async function recusarPedido(rid) {
        try {
            const requestRef = db.collection('trial_requests').doc(rid);
            const requestSnap = await requestRef.get();
            if (!requestSnap.exists || requestSnap.data().status !== 'solicitado') {
                toast('Este pedido já foi processado.');
                return;
            }
            const m = requestSnap.data() || {};
            const batch = db.batch();
            if (m.uid) {
                const ownerRef = db.collection('users').doc(m.uid);
                const ownerSnap = await ownerRef.get();
                const owner = ownerSnap.exists ? ownerSnap.data() || {} : {};
                // Preserva a conta Auth: deixar só o e-mail existente sem
                // perfil impediria nova solicitação com o mesmo endereço.
                if (ownerSnap.exists &&
                    owner.role === 'owner' &&
                    owner.status === 'pending_approval' &&
                    (!Array.isArray(owner.allowedClinics) ||
                     owner.allowedClinics.length === 0)) {
                    batch.update(ownerRef, { status: 'rejected', updatedAt: new Date() });
                }
            }
            batch.update(requestRef, { status: 'recusado' });
            await batch.commit();
            toast('Pedido recusado. A conta foi preservada e poderá solicitar nova análise.');
            loadTab();
        } catch (e) {
            console.error('Falha ao recusar pedido:', e);
            toast('Falha ao recusar. Confira o estado do pedido antes de repetir.');
        }
    }

    async function genDebit(cid) {
        try {
            const cfg = await db.collection('platform_config').doc('geral').get().catch(() => null);
            const base = Number((cfg && cfg.data().basePrice) || 40);
            const extra = Number((cfg && cfg.data().extraPrice) || 15);
            const n = await staffCount(cid);
            const amount = n <= 0 ? 0 : base + extra * (n - 1);
            if (amount <= 0) { toast('Sem usuários: nada a gerar.'); return; }
            const c = await db.collection('clinics').doc(cid).get();
            const m = c.data() || {};
            let ownerEmail = '';
            try {
                const o = await db.collection('users').doc(m.ownerId || '').get();
                ownerEmail = (o.exists && o.data().email) || '';
            } catch (e) {}
            await db.collection('platform_debits').add({
                ownerId: m.ownerId || '', ownerEmail: ownerEmail, clinicId: cid,
                clinicName: m.name || '', users: n, amount: amount, paidAmount: 0,
                date: new Date(), dueDate: new Date(Date.now() + 30 * 86400000),
                status: 'pendente', type: 'assinatura',
            });
            toast('Mensalidade ' + BRL(amount) + ' gerada (' + n + ' usuários).');
        } catch (e) { toast('Falha. Tente de novo.'); }
    }

    function newOwnerTab(body) {
        body.innerHTML = '<div class="card"><div class="big">Novo owner + clínica (trial 7 dias)</div>'
            + '<input id="n-nome" placeholder="Nome">'
            + '<input id="n-email" type="email" placeholder="E-mail (login)">'
            + '<input id="n-senha" type="password" placeholder="Senha inicial">'
            + '<input id="n-clinica" placeholder="Nome da clínica">'
            + '<select id="n-tipo"><option value="dental">Odonto</option><option value="psychology">Psicologia</option></select>'
            + '<button class="btn-ok" id="n-btn" data-action="create-owner">Criar</button></div>';
    }

    async function createOwner() {
        const v = (id) => document.getElementById(id).value.trim();
        if (!v('n-nome') || !v('n-email') || !v('n-senha') || !v('n-clinica')) { toast('Preencha todos os campos.'); return; }
        const btn = document.getElementById('n-btn');
        btn.disabled = true;
        let secondary = null;
        let createdAuthUser = null;
        let provisioned = false;
        try {
            secondary = firebase.initializeApp(firebaseConfig, 'MasterRegister');
            const cred = await secondary.auth().createUserWithEmailAndPassword(v('n-email'), v('n-senha'));
            createdAuthUser = cred.user;
            const uid = cred.user.uid;
            const clinicRef = db.collection('clinics').doc();
            const now = new Date();
            const clinicName = v('n-clinica');
            const type = ['dental', 'psychology'].includes(document.getElementById('n-tipo').value)
                ? document.getElementById('n-tipo').value : 'dental';
            const batch = db.batch();
            batch.set(clinicRef, {
                name: clinicName, type: type,
                ownerId: uid, createdAt: now,
                trialEndsAt: new Date(Date.now() + 7 * 86400000), blockedByAdmin: false,
            });
            batch.set(db.collection('public_clinics').doc(clinicRef.id), {
                name: clinicName, whatsappNumber: '', updatedAt: now,
            });
            const ownerData = {
                email: v('n-email'), name: v('n-nome'), role: 'owner',
                allowedClinics: [clinicRef.id], status: 'Ativo', createdAt: now,
                phone: '', whatsapp: '', cpf: '', menuAccess: {},
            };
            batch.set(db.collection('users').doc(uid), ownerData);
            writeOwnerMemberMirrors(batch, clinicRef.id, uid, ownerData);
            await batch.commit();
            provisioned = true;
            toast('Owner + clínica criados (trial 7 dias).');
            goTab('owners');
        } catch (e) {
            if (!provisioned && createdAuthUser) {
                try { await createdAuthUser.delete(); } catch (_) {}
            }
            console.error('Falha ao provisionar owner:', e);
            toast(e.code === 'auth/email-already-in-use' ? 'E-mail já em uso.' : 'Falha. Tente de novo.');
            btn.disabled = false;
        } finally {
            if (secondary) { try { await secondary.delete(); } catch (e) {} }
        }
    }

    async function debitsTab(body) {
        const ds = await db.collection('platform_debits').orderBy('dueDate', 'desc').limit(100).get();
        if (ds.empty) { body.innerHTML = '<div class="card"><p class="muted">Nenhum débito gerado.</p></div>'; return; }
        let html = '';
        ds.forEach((d) => {
            const m = d.data();
            const paid = String(m.status || '').toLowerCase() === 'pago';
            const noticed = m.avisoPagamento && m.avisoPagamento.ids && m.avisoPagamento.ids.length;
            html += '<div class="card"><div class="row"><div><div class="big">' + esc(m.clinicName || '') + ' — ' + (m.users || 0) + ' usuários</div>'
                + '<div class="muted">' + esc(m.ownerEmail || '') + ' • ' + (paid ? 'Pago' : 'Pendente') + (noticed && !paid ? ' • Avisei que paguei' : '') + '</div></div>'
                + '<div class="big">' + BRL(m.amount) + '</div></div>';
            if (!paid) {
                html += '<div class="btn-row"><button class="btn-ghost" data-action="settle-debit" data-id="' + esc(d.id) + '" data-amount="' + Number(m.amount || 0) + '">Dar baixa</button>';
                if (noticed) html += '<button class="btn-ghost" data-action="dismiss-notice" data-id="' + esc(d.id) + '">Dispensar aviso</button>';
                html += '</div>';
            }
            html += '</div>';
        });
        body.innerHTML = html;
    }

    async function settle(id, amount) {
        try {
            await db.collection('platform_debits').doc(id).update({status: 'pago', paidAmount: amount, paymentDate: new Date()});
            toast('Baixa dada.');
            loadTab();
        } catch (e) { toast('Falha. Tente de novo.'); }
    }

    async function dismissNotice(id) {
        try {
            await db.collection('platform_debits').doc(id).update({avisoPagamento: firebase.firestore.FieldValue.delete()});
            loadTab();
        } catch (e) { toast('Falha. Tente de novo.'); }
    }

    async function trialsTab(body) {
        const limit = new Date(Date.now() + 3 * 86400000);
        const cs = await db.collection('clinics').get();
        let html = '';
        cs.forEach((c) => {
            const m = c.data();
            const t = ts2d(m.trialEndsAt);
            if (!t || (t >= limit && m.blockedByAdmin !== true)) return;
            const over = t < new Date();
            html += '<div class="card"><div class="row"><div><div class="big">' + esc(m.name || '') + '</div>'
                + '<div class="muted">' + (over ? 'trial expirado' : 'vence ' + fmtD(t)) + (m.blockedByAdmin === true ? ' • BLOQUEADA' : '') + '</div></div>'
                + '<button class="btn-ghost" data-action="toggle-block" data-id="' + esc(c.id) + '" data-blocked="' + (m.blockedByAdmin !== true) + '">' + (m.blockedByAdmin === true ? 'Liberar' : 'Bloquear') + '</button>'
                + '</div></div>';
        });
        body.innerHTML = html || '<div class="card"><p class="muted">Nenhum trial vencendo.</p></div>';
    }
</script>
</body>
</html>
